name: dhara_mitra
description: "Dhara Mitra - farm diary for South Karnataka gardens"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  uuid: ^4.6.0
  collection: ^1.19.1
  http: ^1.6.0
  image_picker: ^1.2.4
  file_picker: ^13.2.0
  open_filex: ^5.0.0
  local_auth: ^3.0.2
  speech_to_text: ^7.5.0
  geolocator: ^14.0.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  workmanager: ^0.10.10
  archive: ^3.6.1
  pdf: ^3.12.0
  excel: ^4.0.6
  record: ^7.1.2
  audioplayers: ^6.8.1
  connectivity_plus: ^7.3.2
  flutter_timezone: ^5.1.1
  crypto: ^3.0.7
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
  phone_numbers_parser: ^9.0.28
  supabase_flutter: 2.10.0
  shared_preferences: 2.5.6
  app_links: 6.4.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  path_provider_platform_interface: 2.1.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/logo.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: NotoSansKannada
      fonts:
        - asset: assets/fonts/NotoSansKannada-Regular.ttf
        - asset: assets/fonts/NotoSansKannada-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansKannada-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansKannada-Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
