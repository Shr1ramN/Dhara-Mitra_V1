name: Verify release source

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

concurrency:
  group: release-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify promotion from develop
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # This workflow runs from master and uses only GitHub's PR metadata.
      - name: Require this repository's develop branch
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          if [[ "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" || "$SOURCE_BRANCH" != develop ]]; then
            echo "::error::The release branch accepts PRs only from this repository's develop branch."
            exit 1
          fi
