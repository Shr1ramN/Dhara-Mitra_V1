name: Android quality and delivery

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub workflows
        working-directory: .
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Audit resolved Flutter dependencies
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 \
            --output "$RUNNER_TEMP/osv-scanner"
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $RUNNER_TEMP/osv-scanner" | sha256sum --check
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source -L pubspec.lock
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    name: Android build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: flutter build apk --release --build-number=$((20000 + BUILD_NUMBER))
      - name: Prepare installable APK
        run: |
          set -euo pipefail
          mkdir -p apk-release
          cp build/app/outputs/flutter-apk/app-release.apk apk-release/DharaMitra.apk
          (cd apk-release && sha256sum DharaMitra.apk > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DharaMitra-apk
          path: |
            app/apk-release/DharaMitra.apk
            app/apk-release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Android release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect app changes
        id: changes
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          if git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null &&
            git diff --quiet "$PREVIOUS_SHA" "$GITHUB_SHA" -- app/ ':(exclude)app/README.md'; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.changes.outputs.publish == 'true' }}
        with:
          name: DharaMitra-apk
          path: apk-release
      - name: Publish directly installable APK
        if: ${{ steps.changes.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          tag="develop-build-${BUILD_NUMBER}-${BUILD_ATTEMPT}"
          title="Develop preview ${BUILD_NUMBER}.${BUILD_ATTEMPT}"
          flags=(--prerelease)
          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            tag="release-${BUILD_NUMBER}-${BUILD_ATTEMPT}"
            version=$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)
            title="Dhara Mitra ${version} (build ${BUILD_NUMBER}.${BUILD_ATTEMPT})"
            flags=(--latest)
          fi
          printf "Dhara Mitra Android build from \`%s\`.\n\nDownload **DharaMitra.apk** directly below (no ZIP). Uses the public development signing key.\n" "$SOURCE_SHA" > apk-release/notes.md
          gh release create "$tag" apk-release/DharaMitra.apk apk-release/SHA256SUMS \
            --target "$SOURCE_SHA" --title "$title" \
            "${flags[@]}" --notes-file apk-release/notes.md
