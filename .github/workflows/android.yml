name: Android quality and delivery

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build test APK
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: flutter build apk --release --build-number=$((20000 + BUILD_NUMBER))
      - name: Prepare installable APK
        run: |
          set -euo pipefail
          mkdir -p apk-release
          cp build/app/outputs/flutter-apk/app-release.apk apk-release/DharaMitra.apk
          (cd apk-release && sha256sum DharaMitra.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: DharaMitra-apk
          path: |
            app/apk-release/DharaMitra.apk
            app/apk-release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish develop preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DharaMitra-apk
          path: apk-release
      - name: Publish directly installable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          tag="develop-build-${BUILD_NUMBER}-${BUILD_ATTEMPT}"
          printf 'Development preview from `%s`.\n\nDownload **DharaMitra.apk** directly below (no ZIP). Uses the public development signing key.\n' "$SOURCE_SHA" > apk-release/notes.md
          gh release create "$tag" apk-release/DharaMitra.apk apk-release/SHA256SUMS \
            --target "$SOURCE_SHA" --title "Develop preview ${BUILD_NUMBER}.${BUILD_ATTEMPT}" \
            --prerelease --notes-file apk-release/notes.md
