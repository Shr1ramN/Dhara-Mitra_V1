<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhara Mitra — UI Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --bg-subtle: #fbf8f5;
  --surface: #ffffff;
  --border: #eee7de;
  --text-primary: #1c1a17;
  --text-secondary: #6b645b;
  --accent: #e8712a;
  --accent-hover: #c85e1f;
  --accent-soft: #fdefe3;
  --gradient-accent: linear-gradient(135deg, #e8712a 0%, #ffb04d 100%);
  --shadow-sm: 0 1px 2px rgba(28,26,23,0.04);
  --shadow-md: 0 8px 24px rgba(28,26,23,0.08);
  --font-display: "Space Grotesk", "Inter", sans-serif;
  --font-body: "Inter", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
  --font-kn: "Noto Sans Kannada", "Inter", sans-serif;
  --radius: 14px;
  --up: #2e8b57;
  --down: #c0392b;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text-primary); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }

/* ---------- Page shell ---------- */
.hero { position: relative; background: var(--bg-subtle); overflow: hidden; }
.hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(rgba(232,113,42,.20) 1px, transparent 1px);
  background-size: 18px 18px;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 95%);
  mask-image: linear-gradient(180deg, #000 0%, transparent 95%);
}
.hero-inner { position: relative; max-width: 1280px; margin: 0 auto; padding: 40px 24px 28px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; color: var(--accent); font-weight: 600; }
.hero h1 { font-family: var(--font-display); font-size: 40px; margin: 8px 0 6px; letter-spacing: -.02em; }
.hero h1 .kn-title { font-family: var(--font-kn); font-weight: 600; color: var(--text-secondary); font-size: 24px; margin-left: 10px; letter-spacing: 0; }
.lede { color: var(--text-secondary); max-width: 640px; margin: 0; line-height: 1.55; }
.lang-switch { display: inline-flex; background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 4px; box-shadow: var(--shadow-sm); }
.lang-switch button { border: 0; background: transparent; padding: 8px 18px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--text-secondary); cursor: pointer; transition: all .15s ease; }
.lang-switch button[data-lang="kn"] { font-family: var(--font-kn); }
.lang-switch button.on { background: var(--accent); color: #fff; }
.hairline { height: 2px; background: var(--gradient-accent); }

.stage { max-width: 1280px; margin: 0 auto; padding: 32px 24px 64px; display: grid; grid-template-columns: 230px 400px minmax(0, 1fr); gap: 36px; align-items: start; }
.screen-nav { position: sticky; top: 24px; }
.nav-group { margin-bottom: 20px; }
.nav-group h4 { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-secondary); margin: 0 0 8px 12px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 12px; border: 1px solid transparent; border-radius: 10px; background: transparent; font-weight: 500; font-size: 14px; color: var(--text-primary); cursor: pointer; transition: all .15s ease; }
.nav-item:hover { background: var(--bg-subtle); }
.nav-item.on { background: var(--accent-soft); border-color: rgba(232,113,42,.25); color: var(--accent-hover); }
.nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex: none; }
.nav-item.on .dot { background: var(--accent); }

.phone-wrap { display: flex; justify-content: center; }
.phone { width: 400px; height: 840px; background: #1c1a17; border-radius: 52px; padding: 12px; box-shadow: 0 30px 60px rgba(28,26,23,.20), 0 0 0 1px rgba(0,0,0,.4) inset; }
.screen { position: relative; width: 100%; height: 100%; background: var(--bg-subtle); border-radius: 40px; overflow: hidden; display: flex; flex-direction: column; font-size: 14px; }
body.kn .screen { font-family: var(--font-kn); }

.notes { position: sticky; top: 24px; }
.note-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 24px; }
.note-card .tag { font-family: var(--font-mono); font-size: 11px; color: var(--accent); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.note-card h2 { font-family: var(--font-display); font-size: 24px; margin: 6px 0 8px; letter-spacing: -.01em; }
.note-card p { color: var(--text-secondary); line-height: 1.55; margin: 0 0 16px; }
.note-card ul { list-style: none; padding: 0; margin: 0; }
.note-card li { position: relative; padding: 10px 0 10px 18px; border-top: 1px dashed var(--border); line-height: 1.5; font-size: 14px; }
.note-card li::before { content: ""; position: absolute; left: 2px; top: 18px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.fid { display: inline-block; font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--accent-hover); background: var(--accent-soft); border-radius: 6px; padding: 1px 6px; margin-left: 4px; }
.note-tip { margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: var(--bg-subtle); border: 1px solid var(--border); font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.note-tip b { color: var(--text-primary); }

/* ---------- App chrome ---------- */
.notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 110px; height: 28px; background: #1c1a17; border-radius: 20px; z-index: 6; }
.statusbar { flex: none; height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 4px 30px 0; font-family: var(--font-body); font-weight: 600; font-size: 13px; }
.appbar { flex: none; display: flex; align-items: center; gap: 12px; padding: 4px 18px 12px; }
.appbar h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: -.01em; line-height: 1.2; }
body.kn .appbar h2 { font-family: var(--font-kn); font-size: 19px; }
.appbar .sub { font-size: 12px; color: var(--text-secondary); margin-bottom: 2px; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border); background: #fff; display: grid; place-items: center; cursor: pointer; color: var(--text-primary); flex: none; transition: all .15s ease; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.content { flex: 1; overflow-y: auto; padding: 2px 16px 104px; scrollbar-width: none; }
.content::-webkit-scrollbar { display: none; }
.bottomnav { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; padding-bottom: 14px; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid var(--border); display: flex; z-index: 4; }
.bn { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--text-secondary); cursor: pointer; }
.bn-ic { width: 48px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background .15s ease; }
.bn.on { color: var(--accent-hover); }
.bn.on .bn-ic { background: var(--accent-soft); color: var(--accent); }
.fab { position: absolute; right: 18px; bottom: 96px; width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--gradient-accent); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 24px rgba(232,113,42,.35); cursor: pointer; z-index: 4; transition: transform .15s ease; }
.fab:hover { transform: translateY(-2px); }
.toast { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(16px); background: #1c1a17; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .2s ease; z-index: 10; width: max-content; max-width: 86%; text-align: center; line-height: 1.4; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- App components ---------- */
.card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 14px; margin-bottom: 12px; }
.tap { cursor: pointer; transition: transform .18s ease, box-shadow .18s ease; }
.tap:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.sec { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 2px 10px; }
.sec h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); }
body.kn .sec h3 { font-family: var(--font-kn); text-transform: none; letter-spacing: 0; font-size: 14px; }
.link { font-size: 12px; font-weight: 600; color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--text-secondary); }
.small { font-size: 12px; }
.xs { font-size: 11px; }
.mono { font-family: var(--font-mono); }
.b { font-weight: 600; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -.01em; }
.mid { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--text-secondary); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #fff; border: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; cursor: pointer; transition: all .15s ease; }
.chip.static { cursor: default; background: var(--bg-subtle); }
.chip.sel { background: var(--accent-soft); border-color: rgba(232,113,42,.4); color: var(--accent-hover); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.cdot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.pill.drying { background: var(--accent-soft); color: var(--accent-hover); }
.pill.storage { background: #eaf4ee; color: #23704a; }
.pill.sold { background: #f1efec; color: var(--text-secondary); }
.pill.warn { background: #fff4d6; color: #8a6100; }
.progress { height: 8px; border-radius: 99px; background: var(--bg-subtle); overflow: hidden; border: 1px solid var(--border); }
.progress > i { display: block; height: 100%; background: var(--gradient-accent); border-radius: 99px; }
.alert { background: linear-gradient(135deg, #fff1e6, #fff 80%); border: 1px solid rgba(232,113,42,.35); border-radius: 12px; padding: 12px; display: flex; gap: 12px; align-items: flex-start; margin-top: 12px; }
.alert .a-ic { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.ok-line { margin-top: 12px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--up); }
.qa { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.qa button { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--text-primary); cursor: pointer; transition: all .15s ease; }
.qa button:hover { border-color: rgba(232,113,42,.4); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.qi { width: 38px; height: 38px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.pstrip { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 6px; margin: 0 -2px; }
.pstrip::-webkit-scrollbar { display: none; }
.pcard { min-width: 128px; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px; cursor: pointer; transition: all .15s ease; }
.pcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.lrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--border); }
.lrow:last-child { border-bottom: 0; padding-bottom: 2px; }
.lrow:first-child { padding-top: 2px; }
.lrow.tap:hover { transform: none; box-shadow: none; background: var(--bg-subtle); }
.avatar { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--accent-soft); color: var(--accent-hover); flex: none; font-family: var(--font-body); }
.avatar.sm { width: 26px; height: 26px; border-radius: 9px; font-size: 10px; border: 2px solid #fff; margin-left: -6px; }
.avatar.sm:first-child { margin-left: 0; }
.ricon { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; background: var(--bg-subtle); color: var(--text-primary); border: 1px solid var(--border); }
.seg { display: flex; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 12px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 9px; font-weight: 600; font-size: 12.5px; color: var(--text-secondary); cursor: pointer; transition: all .15s ease; }
.seg button.on { background: var(--accent); color: #fff; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 13px; border-bottom: 1px dashed var(--border); }
.kv:last-child { border-bottom: 0; }
.kv > span:first-child { color: var(--text-secondary); }
.kv > span:last-child { font-weight: 600; text-align: right; }
.wline { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
.wline:last-child { border-bottom: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
.kpi .v { font-family: var(--font-display); font-weight: 700; font-size: 17px; margin-top: 4px; }
.kpi .l { font-size: 11px; color: var(--text-secondary); line-height: 1.3; }
.btn { border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all .15s ease; }
.btn.primary { background: var(--gradient-accent); color: #fff; box-shadow: 0 8px 20px rgba(232,113,42,.28); }
.btn.primary:hover { transform: translateY(-1px); }
.btn.ghost { background: #fff; border: 1px solid var(--border); color: var(--text-primary); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent-hover); }
.btn.sm { padding: 8px 12px; font-size: 12px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn-row { display: flex; gap: 10px; margin-top: 4px; }
.btn-row .btn { flex: 1; }

/* timeline */
.tl { position: relative; padding-left: 30px; margin-top: 6px; }
.tl-item { position: relative; padding-bottom: 14px; }
.tl-item::before { content: ""; position: absolute; left: -20px; top: 24px; bottom: 0; width: 2px; background: var(--border); }
.tl-item:last-child::before { display: none; }
.tl-item.done::before { background: rgba(232,113,42,.45); }
.tl-dot { position: absolute; left: -30px; top: 0; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); background: #fff; display: grid; place-items: center; color: #fff; }
.done .tl-dot { background: var(--accent); border-color: var(--accent); }
.active .tl-dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.active .tl-dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.tl-head { display: flex; justify-content: space-between; align-items: center; min-height: 22px; margin-bottom: 8px; }
.tl-head b { font-size: 14px; }
.todo .tl-head b { color: var(--text-secondary); font-weight: 600; }
.tl .card { margin-bottom: 0; }

/* diary */
.day { display: grid; grid-template-columns: 44px 1fr; gap: 10px; }
.dcol { text-align: center; padding-top: 10px; }
.dcol b { display: block; font-family: var(--font-display); font-size: 20px; line-height: 1; }
.dcol span { font-size: 11px; color: var(--text-secondary); }
.type-ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; color: #fff; }

/* forms */
.field { margin-bottom: 18px; }
.field > label { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; letter-spacing: .02em; }
.input { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 12px; font: inherit; font-size: 14px; background: #fff; color: var(--text-primary); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.counter { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #fff; }
.counter button { width: 38px; height: 38px; border: 0; background: #fff; font-size: 18px; cursor: pointer; color: var(--accent); }
.counter span { min-width: 34px; text-align: center; font-weight: 700; }
.toggle { width: 44px; height: 26px; border-radius: 99px; background: #ddd5cb; position: relative; border: 0; cursor: pointer; flex: none; transition: background .15s ease; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); transition: left .15s ease; }
.toggle.on { background: var(--accent); }
.toggle.on::after { left: 21px; }
.voice { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px dashed rgba(232,113,42,.5); border-radius: 12px; background: #fffaf6; cursor: pointer; }
.voice .mic { width: 40px; height: 40px; border-radius: 50%; background: var(--gradient-accent); color: #fff; display: grid; place-items: center; flex: none; }
.total-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px; border-radius: 14px; background: #1c1a17; color: #fff; margin-bottom: 12px; }

/* prices */
.chart { width: 100%; height: auto; display: block; margin-top: 10px; }
.spark { width: 64px; height: 26px; display: block; }
.prow { display: grid; grid-template-columns: 1fr 60px 104px; gap: 8px; align-items: center; padding: 11px 0; border-bottom: 1px dashed var(--border); }
.prow:last-child { border-bottom: 0; }

/* bars */
.hbar { margin-bottom: 12px; }
.hbar:last-child { margin-bottom: 0; }
.hbar .track { height: 10px; border-radius: 99px; background: var(--bg-subtle); border: 1px solid var(--border); overflow: hidden; margin-top: 6px; }
.hbar .track > i { display: block; height: 100%; border-radius: 99px; }

/* weather */
.hourly { display: flex; gap: 8px; align-items: flex-end; height: 56px; }
.hr { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: var(--text-secondary); }
.hr i { width: 10px; border-radius: 4px; background: linear-gradient(180deg, #7fb2e5, #4a86c5); display: block; }
.wx-ic { width: 46px; height: 46px; border-radius: 14px; background: #eaf2fb; color: #3b77b8; display: grid; place-items: center; }

/* calendar */
.cal-crop { display: flex; gap: 12px; align-items: flex-start; }
.cal-crop .bar { width: 4px; align-self: stretch; border-radius: 4px; flex: none; }

/* more grid */
.mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mtile { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s ease; text-align: center; color: var(--text-primary); }
.mtile:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: rgba(232,113,42,.4); }
.mtile .qi { width: 36px; height: 36px; }

.hero-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.net-toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 10px 16px; font-weight: 600; font-size: 13px; color: var(--text-primary); cursor: pointer; box-shadow: var(--shadow-sm); transition: all .15s ease; }
.net-toggle:hover { border-color: var(--accent); }
.net-toggle .nd { width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 3px rgba(46,139,87,.15); }
.net-toggle.off .nd { background: #a39a8f; box-shadow: 0 0 0 3px rgba(163,154,143,.2); }
.offline { display: flex; gap: 10px; align-items: flex-start; background: #f1efec; border: 1px solid #e3ddd5; border-radius: 12px; padding: 10px 12px; font-size: 12px; line-height: 1.45; color: var(--text-secondary); margin-bottom: 12px; }
.offline svg { flex: none; margin-top: 1px; color: var(--text-primary); }
.mgrid.four { grid-template-columns: repeat(4, 1fr); }
.mgrid.four .mtile { font-size: 11px; padding: 12px 4px; }
.doc { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-subtle); font-size: 12px; font-weight: 600; line-height: 1.3; }
.doc .ricon { width: 30px; height: 30px; border-radius: 9px; background: #fff; }
.disclaimer { text-align: center; font-size: 11px; color: var(--text-secondary); margin-top: 16px; font-family: var(--font-mono); }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .stage { grid-template-columns: 400px minmax(0, 1fr); }
  .screen-nav { grid-column: 1 / -1; position: static; display: flex; flex-wrap: wrap; gap: 8px 24px; }
  .nav-group { margin-bottom: 0; }
  .nav-group .items { display: flex; flex-wrap: wrap; gap: 4px; }
  .nav-item { width: auto; }
}
@media (max-width: 860px) {
  .stage { grid-template-columns: 1fr; }
  .notes { position: static; }
}
@media (max-width: 768px) {
  .hero h1 { font-size: 30px; }
  .hero h1 .kn-title { display: block; margin: 4px 0 0; }
}
@media (max-width: 440px) {
  .stage { padding: 16px 0 40px; }
  .screen-nav, .notes { padding: 0 16px; }
  .phone { width: 100%; height: 100vh; border-radius: 0; padding: 0; box-shadow: none; }
  .screen { border-radius: 0; }
  .notch { display: none; }
}

function sparkSvg(arr, w, h, stroke, fill, id, cls = 'chart') {
  const min = Math.min(...arr), max = Math.max(...arr), span = max - min || 1;
  const pts = arr.map((v, i) => [(i / (arr.length - 1)) * w, h - 4 - ((v - min) / span) * (h - 8)]);
  const line = pts.map(p => p.map(x => x.toFixed(1)).join(',')).join(' ');
  const area = fill ? `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${stroke}" stop-opacity=".22"/><stop offset="1" stop-color="${stroke}" stop-opacity="0"/></linearGradient></defs><polygon fill="url(#${id})" points="0,${h} ${line} ${w},${h}"/>` : '';
  const last = pts[pts.length - 1];
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none">${area}<polyline fill="none" stroke="${stroke}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${line}"/>${fill ? `<circle cx="${last[0]}" cy="${last[1]}" r="4" fill="#fff" stroke="${stroke}" stroke-width="2"/>` : ''}</svg>`;
}

}
const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;

function stageBody(l, key) {
  const h = l.harvest;
  if (key === 'harvest') {
    const countLabel = { areca: 'f_palms', coconut: 'f_trees', pepper: 'f_vines', banana: 'f_bunches' }[l.crop];
    const qtyLabel = { areca: 'f_fresh', coconut: 'f_nuts', pepper: 'f_green', banana: 'f_weight' }[l.crop];
    const qtyVal = l.crop === 'coconut' ? num(h.qty) : `${num(h.qty)} ${t('u_kg')}`;
    return kv(t('f_date'), fmt(h.date)) + kv(t('f_plot'), plotNames(h.plots)) + kv(t(countLabel), num(h.count)) + kv(t(qtyLabel), qtyVal) + workerLines(h.workers);
  }
  if (key === 'drying' && l.drying) {
    const d = l.drying;
    let out = kv(t('f_started'), fmt(d.start));
    if (d.end) {
      out += kv(t('f_finished'), fmt(d.end)) + kv(t('f_days_yard'), `${daysBetween(d.start, d.end)} ${t('u_days')}`);
    } else {
      const dd = daysBetween(d.start, TODAY);
      out += `<div style="padding:8px 0"><div class="small b" style="margin-bottom:6px">${t('day_of', dd, d.target)}</div><div class="progress"><i style="width:${Math.round(dd / d.target * 100)}%"></i></div><div class="xs muted" style="margin-top:6px">${t('expected')}: ${fmt(addDays(d.start, d.target))}</div></div>`;
    }
    if (d.outKg) out += kv(t('f_dry'), `${d.outKg} ${t('u_kg')} (${(d.outKg / h.qty * 100).toFixed(1)}%)`);
    out += kv(t('f_yard'), L(d.yard)) + kv(t('f_covers'), t('n_times', d.covers + (l.id === 'A-2627-01' && state.covered ? 1 : 0)));
    return out;
  }
  if (key === 'peeling' && l.peeling) {
    const p = l.peeling;
    const cost = p.workers.reduce((s, w) => s + w[4], 0);
    return kv(t('f_dates'), `${fmtShort(p.start)} – ${fmtShort(p.end)}`) + kv(t('f_in'), `${num(p.inKg)} ${t('u_kg')}`) + kv(t('f_out'), `${num(p.outKg)} ${t('u_kg')}`) +
      kv(t('f_outturn'), `${(p.outKg / p.inKg * 100).toFixed(1)}%`) + workerLines(p.workers) + kv(t('f_peel_cost'), inr(cost));
  }
  if (key === 'grading' && l.grading) {
    const tot = l.grading.reduce((s, g) => s + g[1], 0);
    return l.grading.map(([g, k]) => `<div class="hbar"><div class="row between small"><span>${t(g)}</span><b>${k} ${t('u_kg')}</b></div><div class="track"><i style="width:${k / tot * 100}%;background:${g === 'g_chali' ? CROPC.areca : '#c9bfb2'}"></i></div></div>`).join('');
  }
  if (key === 'storage' && l.storage) {
    const s = l.storage;
    let out = kv(t('f_since'), fmt(s.start));
    if (s.end) out += kv(t('f_until'), fmt(s.end));
    out += kv(t('f_days_store'), `${daysBetween(s.start, s.end || TODAY)} ${t('u_days')}`) + kv(t('f_place'), L(s.place));
    if (s.priceThen && !s.end) {
      const now = PBEST[s.price];
      const pct = ((now - s.priceThen) / s.priceThen * 100).toFixed(1);
      out += kv(t('f_price_then'), `₹${s.priceThen}${t('r_kg')}`) + kv(t('f_price_now'), `₹${now}${t('r_kg')} <span class="up">(+${pct}%)</span>`);
    } else if (s.priceThen) {
      out += kv(t('f_price_then'), `₹${s.priceThen}${t('r_kg')}`);
    }
    if (s.soldKg) out += kv(t('f_sold_so_far'), `${s.soldKg} ${t('u_kg')} × ₹${s.soldRate} = ${inr(s.soldKg * s.soldRate)}`) + kv(t('f_left'), `${s.kg} ${t('u_kg')}`);
    return out;
  }
  if (key === 'sale' && l.sale) {
    const s = l.sale;
    const tot = saleTotal(s);
    return kv(t('f_date'), fmt(s.date)) + kv(t('f_buyer'), L(BUYERS[s.buyer])) +
      s.lines.map(([g, q, u, r]) => kv(t(g), `${num(q)} ${t(u)} × ₹${r} = ${inr(q * r)}`)).join('') +
      kv(t('f_total'), inr(tot)) +
      (s.received >= tot ? kv(t('f_received'), `<span class="up">${t('fully_paid')}</span>`) : kv(t('f_received'), inr(s.received)) + kv(t('f_pending'), `<span class="down">${inr(tot - s.received)}</span>`));
  }
  return '';
}

function LotDetail() {
  const l = LOTS.find(x => x.id === state.params.id) || LOTS[0];
  const flow = FLOW[l.crop];
  const idx = l.stage === 'sold' ? flow.length : flow.indexOf(l.stage);
  const cost = l.harvest.workers.reduce((s, w) => s + w[4], 0) + (l.peeling ? l.peeling.workers.reduce((s, w) => s + w[4], 0) : 0);
  let value, valueLabel, perKg, perLabel = t('cost_per_kg');
  if (l.sale) { value = saleTotal(l.sale); valueLabel = t('lot_value'); }
  else if (l.stage === 'drying') { value = l.est.chali * PBEST[l.est.price]; valueLabel = t('est_value'); }
  else { value = l.storage.kg * PBEST[l.storage.price] + (l.storage.soldKg ? l.storage.soldKg * l.storage.soldRate : 0); valueLabel = t('est_value'); }
  if (l.crop === 'coconut') { perKg = `₹${(cost / l.harvest.qty).toFixed(2)}`; perLabel = t('cost_per_unit'); }
  else {
    const kgOut = l.peeling ? l.peeling.outKg : l.drying && l.drying.outKg ? l.drying.outKg : l.est ? l.est.chali : l.harvest.qty;
    perKg = `₹${(cost / kgOut).toFixed(1)}`;
  }

  const items = flow.map((k, i) => {
    const status = i < idx ? 'done' : i === idx ? 'active' : 'todo';
    const body = status === 'todo' ? '' : stageBody(l, k);
    const right = status === 'active' ? `<span class="pill drying">${t('in_progress')}</span>` : status === 'todo' ? `<span class="xs muted">${t('not_yet')}</span>` : '';
    return `<div class="tl-item ${status}">
      <div class="tl-dot">${status === 'done' ? ic('check', 12, 3) : ''}</div>
      <div class="tl-head"><b>${t('st_' + k)}</b>${right}</div>
      ${body ? `<div class="card">${body}</div>` : ''}
    </div>`;
  }).join('');

  const actions = l.stage === 'drying'
    ? `<button class="btn ghost" onclick="proto()">${ic('rain', 16)} ${t('btn_cover')}</button><button class="btn primary" onclick="proto()">${ic('check', 16, 2.4)} ${t('btn_finish_dry')}</button>`
    : l.stage === 'storage'
      ? `<button class="btn ghost" onclick="proto()">${ic('droplet', 16)} ${t('btn_check')}</button><button class="btn primary" onclick="proto()">${ic('tag', 16)} ${t('btn_sell')}</button>`
      : `<button class="btn ghost block" onclick="proto()">${ic('msg', 16)} ${t('btn_receipt')}</button>`;

  return `
  <div class="card">
    <div class="row between"><div class="row" style="gap:8px">${cropDot(l.crop)}<span class="small b">${t(l.crop)}</span><span class="xs muted">· ${t('season')} ${l.season}</span></div>${stagePill(l.stage)}</div>
    <div class="grid3" style="margin-top:12px">
      <div><div class="xs muted">${t('lot_cost')}</div><div class="mid">${inr(cost)}</div></div>
      <div><div class="xs muted">${valueLabel}</div><div class="mid">${money(value)}</div></div>
      <div><div class="xs muted">${perLabel}</div><div class="mid">${perKg}</div></div>
    </div>
  </div>
  <div class="tl">${items}</div>
  <div class="btn-row">${actions}</div>
  <div class="disclaimer">${t('sample')}</div>`;
}

function AddActivity() {
  const f = state.form;
  const inputs = FORM_INPUTS[f.type] || [];
  const lab = f.workers.reduce((s, id) => s + worker(id).dayRate * f.days, 0);
  const inp = inputs.reduce((s, [id, q]) => s + q * stockItem(id).price, 0);
  const chip = (on, onclick, label) => `<span class="chip ${on ? 'sel' : ''}" onclick="${onclick}">${label}</span>`;
  return `
  <div class="field"><label>${t('what_work')}</label><div class="chips">

function Reports() {
  const inc = REPORT.income.reduce((s, x) => s + x[1], 0);
  const exp = REPORT.expense.reduce((s, x) => s + x[1], 0);
  const profit = inc - exp;
  const expOf = k => REPORT.expense.find(x => x[0] === k)[1];
  const labourShare = Math.round((expOf('e_labour') + expOf('e_peeling')) / exp * 100);
  const growth = ((profit - REPORT.lastProfit) / REPORT.lastProfit * 100).toFixed(1);
  const maxI = Math.max(...REPORT.income.map(x => x[1]));
  const maxE = Math.max(...REPORT.expense.map(x => x[1]));
  return `
  <div class="chips" style="margin-bottom:12px"><span class="chip sel">${t('season')} 2025–26</span><span class="chip">2024–25</span><span class="chip">2023–24</span></div>
  <div class="grid3">
    <div class="kpi"><div class="l">${t('income')}</div><div class="v">${lakh(inc)}</div></div>
    <div class="kpi"><div class="l">${t('expenses')}</div><div class="v">${lakh(exp)}</div></div>
    <div class="kpi" style="border-color:rgba(46,139,87,.35);background:#f4faf6"><div class="l">${t('profit')}</div><div class="v up">${lakh(profit)}</div></div>
  </div>
  <div class="xs muted" style="margin:8px 4px 0"><span class="up b">▲ ${growth}%</span> ${t('vs_last')}</div>
  <div class="sec"><h3>${t('income_by_crop')}</h3></div>
  <div class="card">${REPORT.income.map(([c, v]) => `<div class="hbar"><div class="row between small"><span class="row" style="gap:6px">${cropDot(c)}${t(c)}</span><b>${money(v)}</b></div><div class="track"><i style="width:${v / maxI * 100}%;background:${CROPC[c]}"></i></div></div>`).join('')}</div>
  <div class="sec"><h3>${t('where_money')}</h3></div>
  <div class="card">${REPORT.expense.map(([k, v]) => `<div class="hbar"><div class="row between small"><span>${t(k)}</span><b>${money(v)}</b></div><div class="track"><i style="width:${v / maxE * 100}%;background:var(--gradient-accent)"></i></div></div>`).join('')}</div>
  <div class="sec"><h3>${t('key_numbers')}</h3></div>
  <div class="card">
    ${kv(t('k_chali'), `${num(REPORT.chaliKg)} ${t('u_kg')}`)}

    ${kv(t('k_profit_acre'), lakh(profit / REPORT.acres))}

  <div class="btn-row">
    <button class="btn ghost sm" onclick="proto()">${ic('download', 14)} PDF</button>
    <button class="btn ghost sm" onclick="proto()">${ic('download', 14)} Excel</button>
    <button class="btn primary sm" onclick="proto()">${ic('msg', 14)} ${t('wa')}</button>
  </div>
  <div class="disclaimer">${t('sample')}</div>`;
}

function LoanDetail() {
  const l = LOANS.find(x => x.id === state.params.id) || LOANS[0];
  const c = loanCalc(l);
  const land = l.security ? landOf(l.security) : null;
  let txns;
  if (l.kind === 'term') {
    txns = c.paid.slice(-6).reverse().map(r => ({ d: r.d, label: `${t('t_emi')} · #${r.k}`, sub: `${t('principal')} ${inr(r.prin)} · ${t('interest')} ${inr(r.int)}`, amt: -r.emi }));
    txns.push({ d: l.start, label: t('t_disbursed'), sub: '', amt: l.amount });
  } else if (l.kind === 'kcc') {
    txns = [...l.txns].reverse().map(x => ({ d: x.d, label: t(x.k), sub: '', amt: x.k === 't_withdrawal' ? x.amt : -x.amt }));
  } else {
    txns = [{ d: l.start, label: t('t_disbursed'), sub: '', amt: l.amount }];
  }
  return `
  <div class="card">
    <div class="row"><div class="ricon">${ic(l.kind === 'gold' ? 'wallet' : 'landmark', 18)}</div><div class="grow"><div class="b">${L(l.lender)}</div><div class="xs muted">${loanKind(l)}</div></div></div>
    <div style="margin-top:8px">
      ${kv(l.kind === 'kcc' ? t('limit') : t('sanctioned'), `${inr(l.kind === 'kcc' ? l.limit : l.amount)} · ${fmt(l.start)}`)}
      ${kv(t('rate'), loanRate(l))}
      ${l.kind === 'term' ? kv(t('tenure'), `${t('months', l.tenure)} · ${t('emi')} ${inr(c.emi)}`) : kv(t('renewal'), fmt(l.due))}
      ${kv(t('security'), land ? `${landLabel(land)} · ${extent(land)}` : t('gold_security'))}
    </div>
  </div>
  <div class="grid3">
    <div class="kpi"><div class="l">${t('principal')}</div><div class="v">${money(c.principal)}</div></div>
    <div class="kpi"><div class="l">${t('accrued')}</div><div class="v">${inr(c.interest)}</div></div>
    <div class="kpi" style="border-color:rgba(232,113,42,.4);background:#fffaf6"><div class="l">${t('to_close')}</div><div class="v" style="color:var(--accent-hover)">${money(c.principal + c.interest)}</div></div>
  </div>
  ${l.kind === 'term' ? `<div class="card" style="margin-top:12px">
      <div class="row between small" style="margin-bottom:6px"><b>${t('emis_paid', c.paid.length, l.tenure)}</b><span class="muted">${Math.round(c.paid.length / l.tenure * 100)}%</span></div>
      <div class="progress"><i style="width:${c.paid.length / l.tenure * 100}%"></i></div>
      <div class="row between xs muted" style="margin-top:8px"><span>${t('next_due')}: ${fmt(c.next.date)}</span><b style="color:var(--text-primary)">${inr(c.emi)}</b></div>
    </div>` : ''}
  ${l.kind === 'kcc' ? `<div class="alert" style="margin:12px 0 0"><div class="a-ic">${ic('bell', 16)}</div><div class="small">${t('on_time_tip')}</div></div>` : ''}
  <div class="sec"><h3>${t('txns')}</h3></div>
  <div class="card">${txns.map(x => `
    <div class="lrow">
      <div class="ricon" style="${x.amt < 0 ? 'background:#eaf4ee;color:#23704a;border-color:#cfe6d8' : ''}">${ic(x.amt < 0 ? 'check' : 'download', 15)}</div>
      <div class="grow"><div class="b" style="font-size:13px">${x.label}</div><div class="xs muted">${fmt(x.d)}${x.sub ? ` · ${x.sub}` : ''}</div></div>
      <span class="b ${x.amt < 0 ? 'up' : ''}">${x.amt < 0 ? '− ' : '+ '}${inr(Math.abs(x.amt))}</span>
    </div>`).join('')}
  </div>
  <div class="btn-row">
    ${l.kind === 'kcc' ? `<button class="btn ghost" onclick="proto()">${t('btn_withdraw')}</button>` : ''}
    <button class="btn primary" onclick="proto()">${ic('check', 16, 2.4)} ${t('btn_repay')}</button>
  </div>
  <div class="disclaimer">${t('sample')}</div>`;
}

  sales: { title: 'Sales & buyers', p: 'Every sale, who bought it, and what is still to come.', li: [
    ['Sales list linked to lots.', 'F6.1'],
    ['Pending money highlighted per buyer (Haneef still owes ₹8,320).', 'F6.2']] },
  plots: { title: 'Plots', p: 'The garden, plot by plot.', li: [
    ['Area, soil, irrigation.', 'F1.2'],
    ['Areca palms (age, bearing or not), coconut trees, pepper vines (variety), banana plants.', 'F1.3'],
    ['Last work done on the plot.', 'F2.7']] },
  stock: { title: 'Stock', p: 'Fertilisers, chemicals and fuel; auto-reduced when you log work.', li: [
    ['Quantity bars with a minimum level; low items flagged.', 'F5.1 F5.3'],
    ['Purchase entry with bill photo.', 'F5.2']] },
  more: { title: 'Settings', p: 'Language, units, season, security, backup.', li: [
    ['Kannada / English switch inside the app too.', 'F10.2'],
    ['Units, season start month.', 'F10.7 F1.4'],
    ['App lock, cloud backup, full Excel export.', 'F10.4 F10.5'],
    ['Land & loans and crop insurance & schemes (screens to be designed next).', 'F11 F12'],
    ['Planned: rain gauge log.', 'F8.5']] },
};

function notesKey() {
  if (state.screen !== 'lot') return state.screen;
  const l = LOTS.find(x => x.id === state.params.id) || LOTS[0];
  if (l.crop === 'pepper') return 'lot_pepper';
  return l.stage === 'drying' ? 'lot_drying' : l.stage === 'storage' ? 'lot_storage' : 'lot_sold';
}

function renderNotes() {
  const n = NOTES[notesKey()];
  document.getElementById('notes').innerHTML = `
  <div class="note-card">
    <div class="tag">Screen</div>
    <h2>${n.title}</h2>
    <p>${n.p}</p>
    <ul>${n.li.map(([txt, ids]) => `<li>${txt}${ids ? ids.split(' ').map(i => `<span class="fid">${i}</span>`).join('') : ''}</li>`).join('')}</ul>
    <div class="note-tip"><b>Want changes?</b> Tell me the feature ID (e.g. "F4.4: also log who turned the nuts") or the screen name, and what to add, remove or change.</div>
  </div>`;
}

function renderScreenNav() {
  document.getElementById('screenNav').innerHTML = NAV.map((g, gi) => `
    <div class="nav-group"><h4>${g.g}</h4><div class="items">
      ${g.items.map(([s, label, id], ii) => {
        const on = state.screen === s && (!id || state.params.id === id) && (id || !['lot', 'worker', 'loan'].includes(s));
        return `<button class="nav-item ${on ? 'on' : ''}" onclick="jump(${gi},${ii})"><span class="dot"></span>${label}</button>`;
      }).join('')}
    </div></div>`).join('');
}

function bottomNav(tab) {
  const items = [['home', 'home', 'nav_home'], ['lots', 'leaf', 'nav_lots'], ['diary', 'book', 'nav_diary'], ['labour', 'users', 'nav_labour'], ['prices', 'trend', 'nav_prices']];
  return `<nav class="bottomnav">${items.map(([k, i, l]) => `<button class="bn ${tab === k ? 'on' : ''}" onclick="goTab('${k}')"><span class="bn-ic">${ic(i, 20)}</span>${t(l)}</button>`).join('')}</nav>`;
}

let lastKey = '';
function render() {
  const sc = SCREENS[state.screen];
  const app = document.getElementById('app');
  const key = state.screen + '|' + (state.params.id || '');
  const prev = app.querySelector('.content');
  const keep = prev && key === lastKey ? prev.scrollTop : 0;
  lastKey = key;
  const bar = sc.bar();
  document.body.classList.toggle('kn', state.lang === 'kn');
  document.documentElement.lang = state.lang === 'kn' ? 'kn' : 'en';
  document.querySelectorAll('.lang-switch button').forEach(b => b.classList.toggle('on', b.dataset.lang === state.lang));
  const net = document.getElementById('netBtn');
  net.classList.toggle('off', !state.online);
  net.innerHTML = `<span class="nd"></span>${state.online ? 'Online · simulate offline' : 'Offline · go back online'}`;
  app.innerHTML = `
    <div class="notch"></div>
    <div class="statusbar"><span>9:41</span><span class="row" style="gap:6px">${ic(state.online ? 'wifi' : 'wifiOff', 15, 2)}${ic('battery', 20, 1.6)}</span></div>
    <div class="appbar">
      ${sc.parent ? `<button class="icon-btn" onclick="back()" aria-label="Back">${ic('back')}</button>` : ''}
      <div class="grow">${bar.sub ? `<div class="sub">${bar.sub}</div>` : ''}<h2>${bar.title}</h2></div>
      ${bar.actions || ''}
    </div>
    <div class="content" style="${sc.hideNav ? 'padding-bottom:24px' : ''}">${sc.body()}</div>
    ${sc.fab ? `<button class="fab" onclick="${sc.fab}" aria-label="Add">${ic('plus', 26, 2.2)}</button>` : ''}
    ${sc.hideNav ? '' : bottomNav(sc.tab)}
    <div class="toast" id="toast"></div>`;
  app.querySelector('.content').scrollTop = keep;
  renderNotes();
  renderScreenNav();
}

/* =====================================================================
   Actions
   ===================================================================== */
function go(screen, params = {}) { state.stack.push({ screen: state.screen, params: state.params }); state.screen = screen; state.params = params; render(); }
function back() {
  const p = state.stack.pop();
  if (p) { state.screen = p.screen; state.params = p.params; }
  else { state.screen = SCREENS[state.screen].parent || 'home'; state.params = {}; }
  render();
}
function goTab(tab, sub) { state.stack = []; state.screen = tab; state.params = {}; if (tab === 'labour' && sub) state.labourTab = sub; render(); }
function goLot(id) { go('lot', { id }); }
function goWorker(id) { go('worker', { id }); }
function goLoan(id) { go('loan', { id }); }
function setOnline(v) { state.online = v; render(); toast(t(v ? 'back_online' : 'went_offline')); }
function goPrices(c) { state.priceCrop = c; goTab('prices'); }
function jump(gi, ii) {
  const [s, , id] = NAV[gi].items[ii];
  const parent = SCREENS[s].parent;
  state.stack = parent ? [{ screen: parent, params: {} }] : [];
  if (s === 'addActivity') state.form = newForm();
  state.screen = s; state.params = id ? { id } : {};
  render();
}
function openAdd() { state.form = newForm(); go('addActivity'); }
function setF(k, v) {
  state.form[k] = v;
  if (k === 'type') state.form.remindDays = FORM_REMIND[v] || 30;
  render();
}
function togF(k, v) { const a = state.form[k]; const i = a.indexOf(v); i >= 0 ? a.splice(i, 1) : a.push(v); render(); }
function setDays(d) { state.form.days = Math.max(1, state.form.days + d); render(); }
function saveAct() {
  const f = state.form;
  const inputs = FORM_INPUTS[f.type] || [];
  const title = [`${t('a_' + f.type)} · ${plotNames(f.plots.length ? f.plots : ['P1'])}`];
  state.extraActs.unshift({
    id: 'n' + Date.now(), date: TODAY, days: f.days, type: f.type, title: [title[0], title[0]],
    crops: f.crops.length ? [...f.crops] : ['areca'], plots: f.plots.length ? [...f.plots] : ['P1'],
    labour: f.workers.map(id => [id, worker(id).dayRate * f.days]), inputs: inputs.map(x => [...x]),
    next: f.remind ? addDays(TODAY, f.remindDays) : null,
  });
  const msg = f.remind ? t('saved_rem', fmt(addDays(TODAY, f.remindDays))) : t('saved');
  state.stack = []; state.screen = 'diary'; state.params = {}; state.diaryFilter = 'all';
  render(); toast(msg);
}
function setAtt(w, v) { state.att[w] = v; render(); }
function setAttWork(k) { state.attWork = k; render(); }
function setLotFilter(c) { state.lotFilter = c; render(); }
function setDiaryFilter(c) { state.diaryFilter = c; render(); }
function setPriceCrop(c) { state.priceCrop = c; render(); }
function setLabourTab(k) { state.labourTab = k; render(); }
function setMonth(m) { state.calMonth = m; render(); }
function markCovered() { state.covered = true; render(); toast(t('saved')); }
function toggleAlert() { state.alertOn = !state.alertOn; render(); toast(t('saved')); }
function setLang(l) { state.lang = l; render(); }
function proto() { toast(t('proto')); }
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

state.form = newForm();
render();
</script>
</body>
</html>
